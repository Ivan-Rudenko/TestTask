<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="fw-bold mb-3 text-center">Реєстрація</h3>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">{{ field.label }}</label>
                                <input type="{{ field.field.widget.input_type|default:'text' }}" 
                                       name="{{ field.name }}" 
                                       class="form-control {% if field.errors %}is-invalid{% endif %}" 
                                       value="{{ field.value|default:'' }}" required>
                                {% for error in field.errors %}
                                    <div class="invalid-feedback d-block">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 rounded-3">Зареєструватися</button>
                    </form>
                    <p class="text-center mt-3 text-muted">Вже є акаунт? <a href="{% url 'login' %}" class="text-decoration-none">Увійти</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
